[package]
name = "confluon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The deterministic swarm engine behind Confluon"
repository = "https://github.com/tre-systems/confluon"
homepage = "https://confluon.com/"
readme = "README.md"
keywords = ["artificial-life", "generative-music", "wasm", "web-audio"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
