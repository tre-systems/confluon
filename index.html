<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Confluon is a deterministic energy-driven audiovisual swarm instrument."
    />
    <meta name="theme-color" content="#05070a" />
    <meta name="application-name" content="Confluon" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="canonical" href="https://confluon.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Confluon" />
    <meta property="og:title" content="Confluon" />
    <meta
      property="og:description"
      content="A deterministic audiovisual swarm instrument. Shape the field, hear it respond, and share the score."
    />
    <meta property="og:url" content="https://confluon.com/" />
    <meta property="og:image" content="https://confluon.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Confluon particle populations meeting in a dark luminous field."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Confluon" />
    <meta
      name="twitter:description"
      content="A deterministic audiovisual swarm instrument. Shape the field, hear it respond, and share the score."
    />
    <meta name="twitter:image" content="https://confluon.com/og-card.png" />
    <meta
      name="twitter:image:alt"
      content="Confluon particle populations meeting in a dark luminous field."
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Confluon</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <main id="instrument" aria-label="Confluon audiovisual instrument">
      <canvas id="traces" aria-hidden="true"></canvas>
      <canvas id="field" aria-label="Interactive particle field"></canvas>

      <aside id="controls" class="controls collapsed" aria-label="Instrument controls">
        <button
          class="controls-toggle"
          id="controls-toggle"
          type="button"
          aria-label="Show controls"
          aria-expanded="false"
          aria-controls="controls-body"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2"></circle>
            <circle cx="12" cy="12" r="8.2"></circle>
            <path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3"></path>
          </svg>
        </button>

        <div id="controls-body" class="controls-body">
          <header class="panel-heading">
            <h2>Controls</h2>
            <span id="audio-state" class="audio-state" data-state="waiting">sound waiting</span>
          </header>

          <div class="score-control">
            <label for="field-score">Field</label>
            <select id="field-score">
              <option value="">Current</option>
              <option
                value="/?seed=424242&amp;ecology=72&amp;flow=70&amp;touch=88&amp;halo=110&amp;memory=64&amp;tone=38&amp;level=74&amp;life=1600&amp;mode=gather"
              >
                Still Choir
              </option>
              <option
                value="/?seed=3950471578&amp;ecology=104&amp;flow=90&amp;touch=100&amp;halo=118&amp;memory=56&amp;tone=55&amp;level=74&amp;life=2000&amp;mode=orbit"
              >
                Tidal Assembly
              </option>
              <option
                value="/?seed=153812312&amp;ecology=145&amp;flow=118&amp;touch=118&amp;halo=95&amp;memory=36&amp;tone=72&amp;level=72&amp;life=2600&amp;mode=divide"
              >
                Ember Rift
              </option>
            </select>
            <button id="new-seed" type="button">New</button>
          </div>

          <div class="gesture-control">
            <span>Gesture</span>
            <div class="gesture-modes" role="group" aria-label="Pointer gesture">
              <button type="button" data-gesture="gather" aria-pressed="true">Gather</button>
              <button type="button" data-gesture="orbit" aria-pressed="false">Orbit</button>
              <button type="button" data-gesture="divide" aria-pressed="false">Divide</button>
            </div>
          </div>

          <div class="actions">
            <button id="settle" class="hold-button" type="button">Settle</button>
            <button id="pause" type="button">Pause</button>
            <button id="record" class="record-button" type="button">
              Record <output id="record-time" aria-live="off" hidden>0:00</output>
            </button>
          </div>

          <label class="volume-control">
            <span>Level</span>
            <input id="volume" type="range" min="0" max="100" value="74" />
          </label>

          <details class="tuning">
            <summary>
              <span>Tune</span>
              <span class="disclosure" aria-hidden="true"></span>
            </summary>
            <section class="settings-grid" aria-label="Performance settings">
              <label class="setting-control">
                <span>Ecology <output id="ecology-label" aria-live="off">BALANCED</output></span>
                <input id="ecology" aria-label="Ecology" type="range" min="25" max="180" value="100" />
              </label>
              <label class="setting-control">
                <span>Flow <output id="flow-label" aria-live="off">NATURAL</output></span>
                <input id="flow" aria-label="Flow" type="range" min="50" max="180" value="100" />
              </label>
              <label class="setting-control">
                <span>Touch <output id="gesture-label" aria-live="off">FIRM</output></span>
                <input id="gesture" aria-label="Touch strength" type="range" min="50" max="180" value="100" />
              </label>
              <label class="setting-control">
                <span>Halo <output id="glow-label" aria-live="off">SOFT</output></span>
                <input id="glow" aria-label="Halo" type="range" min="45" max="155" value="100" />
              </label>
              <label class="setting-control">
                <span>Memory <output id="memory-label" aria-live="off">BRIEF</output></span>
                <input id="memory" aria-label="Visual memory" type="range" min="0" max="100" value="42" />
              </label>
              <label class="setting-control">
                <span>Tone <output id="tone-label" aria-live="off">WARM</output></span>
                <input id="tone" aria-label="Tone" type="range" min="0" max="100" value="55" />
              </label>
              <label class="setting-control">
                <span>Life <output id="population-label" aria-live="off">FULL</output></span>
                <input
                  id="population"
                  aria-label="Particle population"
                  type="range"
                  min="600"
                  max="4096"
                  step="8"
                  value="2000"
                />
              </label>
            </section>
          </details>

          <p class="interaction-help">
            Move to stir · poke to startle · drag to use the selected gesture
          </p>

          <div class="panel-foot">
            <span>Seed <output id="seed-value">—</output></span>
            <nav class="panel-links" aria-label="About and sharing">
              <a class="article-link" href="/field">About</a>
              <button id="share-link" class="share-link" type="button">Share</button>
              <a class="article-link" href="/privacy">Privacy</a>
            </nav>
          </div>

          <nav class="panel-support" aria-label="Feedback and support">
            <button id="feedback-button" type="button" hidden>Feedback</button>
            <a href="https://ko-fi.com/robgilks" target="_blank" rel="noopener noreferrer">
              <span aria-hidden="true">♥</span>
              Support Confluon
            </a>
          </nav>
        </div>
      </aside>

      <p id="runtime-status" class="runtime-status" role="status" aria-live="polite"></p>
    </main>

    <script src="/runtime-config.js"></script>
    <script src="/telemetry.js"></script>
    <script type="module" src="/pwa.js"></script>
    <script type="module" src="/web/app.js"></script>
  </body>
</html>
