name = "confluon"
main = "worker.js"
compatibility_date = "2026-07-23"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "confluon.com"
custom_domain = true

[[routes]]
pattern = "www.confluon.com"
custom_domain = true

[[routes]]
pattern = "confluon.tre.systems"
custom_domain = true

[[routes]]
pattern = "geno-5.tre.systems"
custom_domain = true
